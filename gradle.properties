# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# -Xmx4096m -> -Xmx8g: the Kotlin/Native compiler runs inside the Gradle daemon
# here, and the RELEASE iOS framework link
# (:data-firebase:linkReleaseFrameworkIosArm64 -- whole-program optimization over
# Compose Multiplatform + skiko + GitLive + RevenueCat) dies with
# "e: Compilation failed: Java heap space" at 4g. Verified: fails at 4g, succeeds
# at 8g with --rerun-tasks. `kotlin.native.jvmArgs` does NOT help -- it only
# applies when K/N runs in its own daemon JVM, which is not the case here.
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
org.gradle.parallel=true
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true

# Java home configuration for Android Studio bundled JDK
# Note: This is handled by local gradle.sh script for Mac development
# CI/CD environments set JAVA_HOME via setup-java action
# Local development: Set org.gradle.java.home in gradle.properties.local or via JAVA_HOME environment variable
org.gradle.java.home=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home

android.dependency.excludeLibraryComponentsFromConstraints=true

# Xcode 26.6 (this machine) is newer than the max the Kotlin Gradle Plugin has
# tested against (16.0 as of Kotlin 2.1.0) -- cocoapods integration (shared's
# Firebase pods, see shared/build.gradle.kts) works fine in practice, this
# just silences the untested-version warning on every build.
kotlin.apple.xcodeCompatibility.nowarn=true

# `shared`'s cocoapods block (see shared/build.gradle.kts) resolves Firebase
# pods only to build SharedKit.framework itself -- iosApp still embeds that
# framework manually (FRAMEWORK_SEARCH_PATHS/OTHER_LDFLAGS + an
# embedAndSignAppleFrameworkForXcode Run Script phase, kept specifically to
# bundle Compose Multiplatform's resources; see iosApp.xcodeproj history) and
# is not itself CocoaPods-integrated (no Podfile). Since KGP 2.1, `embedAndSign`
# FATALs unconditionally whenever the module has any pod dependency, even
# though iosApp's own Xcode build doesn't use CocoaPods. This is KGP's
# documented (deprecated) escape hatch for exactly that split; switching
# iosApp to real CocoaPods Xcode integration is a bigger change than this spike
# warrants. Property name verified against KGP 2.1.0 source
# (PropertiesProvider.PropertyNames.KOTLIN_APPLE_ALLOW_EMBED_AND_SIGN_WITH_COCOAPODS) --
# it is NOT the shorter name the diagnostic message's wording might suggest.
kotlin.apple.deprecated.allowUsingEmbedAndSignWithCocoaPodsDependencies=true

# Phase 0 KMP spike hit a known K/N caching bug in `libtool` when linking the
# iOS framework with Compose Multiplatform (skiko) native libs (error writing
# framework binary, "has no symbols" warnings on skiko-cache.a objects), and
# disabling the K/N compiler cache for the iOS simulator target was the
# documented workaround at the time.
#
# Re-verified 2026-08-04 against the current toolchain (Kotlin 2.2.20 / Xcode
# 26.6): a forced clean link of :data-firebase's SharedKit.framework does NOT
# reproduce the libtool bug with caching back on (`static`), the produced
# framework has a full symbol table (312k symbols via `nm`), and re-enabling
# the cache cut the cold link time from 5m25s to ~2m on this machine -- caching
# was disabled project-wide for a bug that appears toolchain-specific and no
# longer reproduces. Revert to `none` if the libtool error resurfaces.

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
