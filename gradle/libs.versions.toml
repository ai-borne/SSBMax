[versions]
# Kotlin 2.1.0 -> 2.2.20 -> 2.3.20 (Compose Multiplatform -> 1.11.1, ksp plugin
# below -> 2.3.11). Two independent reasons, in order:
#  (1) Kotlin 2.1.0's Native cinterop toolchain can't parse the Xcode 26 / iOS 26.5
#      SDK's module maps (`_c_standard_library_obsolete requires feature
#      'found_incompatible_headers__check_search_paths'`, unknown ptrdiff_t/size_t/
#      wchar_t) -- Xcode 26 SDK support landed in Kotlin 2.2.20 and is retained in
#      2.3.20, so that constraint is still satisfied.
#  (2) RevenueCat's purchases-kmp (see purchasesKmp below) publishes klibs with
#      abi_version=2.3.0 / compiler_version=2.3.20 for EVERY 3.x release (3.0.0
#      through 3.5.0 checked manifest-by-manifest). Kotlin 2.2.20's KLIB resolver
#      caps out at abi_version <= 2.2.0, so it SKIPS the library with a `w: KLIB
#      resolver: ... incompatible ABI version` warning and then emits a misleading
#      `e: KLIB resolver: Could not find <path>` error -- read the `w:` line, not
#      the `e:` one. This broke :shared:compileKotlinIosSimulatorArm64 from commit
#      3cae7b6b onward. Downgrading purchases-kmp to the 2.x line is NOT an option:
#      2.x is cinterop/framework-based and fails at link with `ld: framework
#      'PurchasesHybridCommon' not found`, i.e. it requires CocoaPods, which this
#      repo bans (see root CLAUDE.md, "iOS dependency management: SPM only").
# Compose Multiplatform 1.10.3 -> 1.11.1 in lockstep: verified by unzipping
# components-resources-iosSimulatorArm64 and reading its klib manifest --
# 1.10.3's is compiler_version=2.2.20, 1.11.0/1.11.1's is compiler_version=2.3.20
# (abi_version=2.3.0), an exact match for Kotlin 2.3.20. The two versions must
# always move together; a mismatch fails with the same misleading resolver error.
# ksp 2.2.20-2.0.3 -> 2.3.11: KSP dropped the `<kotlin>-<ksp>` compound version
# after 2.2.21-2.0.5 and now versions independently; 2.3.11's POM depends on
# kotlin-stdlib 2.3.20 (checked directly), which is the Kotlin 2.3.20 line.
# detekt stays at 1.23.8 (the last release under the io.gitlab.arturbosch.detekt
# coordinate; the dev.detekt 2.0.0 line is still alpha). detekt runs its own
# embedded Kotlin compiler for parsing and does not use the project's Kotlin
# version, so it is unaffected by this bump -- :detekt-rules only compiles
# against detekt-api's Kotlin 1.9 metadata, which Kotlin 2.3.20 reads fine.
# agp 8.7.3 -> 8.13.2 (done alongside the 2.2.20 bump): AGP 8.7.3's bundled Lint
# crashes analyzing Kotlin 2.2.20+ code (`Found class
# org.jetbrains.kotlin.analysis.api.resolution.KaSimpleVariableAccessCall, but
# interface was expected` inside FrequentlyChangingValueDetector) -- Lint's
# embedded Kotlin analysis API is version-locked to AGP, not the project's own
# Kotlin plugin version. AGP 8.13.2 explicitly supports Kotlin up to 2.3
# (via R8 8.13.19). Requires Gradle >= 8.13 (see
# gradle/wrapper/gradle-wrapper.properties, bumped from 8.11 in lockstep).
agp = "8.13.2"
kotlin = "2.3.20"
detekt = "1.23.8"

# KMP Spike (Phase 0) — shared module only, isolated from existing app/core modules
composeMultiplatform = "1.11.1"
koin = "4.1.0"
koinCompose = "4.1.0"
sqldelight = "2.1.0"
gitliveFirebase = "2.1.0"
ktorClientDarwin = "3.0.2"
# 0.6.2 -> 0.7.1: 0.6.2's kotlinx.datetime.Clock/Instant collide with the
# stdlib's own kotlin.time.Clock/Instant (stabilized in Kotlin 2.1+), breaking
# `Clock.System.now()` call sites across shared/commonMain with "Unresolved
# reference 'System'" under Kotlin 2.2.20. 0.7.1 makes kotlinx.datetime.Clock/
# Instant typealiases for the stdlib ones, so existing call sites keep
# compiling unmodified.
kotlinxDatetime = "0.7.1"
kotlinxSerialization = "1.7.3"
multiplatformSettings = "1.3.0"
workManager = "2.9.0"

# Phase 5 (UI): KMP navigation + image loading for shared/commonMain
# 2.9.0-beta02 -> 2.9.2: the beta was never revisited after Phase 5; 2.9.2 is the
# stable release of the same line.
navigationComposeKmp = "2.9.2"
# 3.0.4 -> 3.4.0, NOT the newer 3.5.0: 3.5.0's iOS klib is abi_version=2.4.0
# (built by the Kotlin 2.4.0 compiler), which Kotlin 2.3.20's resolver skips with
# the same misleading "Could not find <klib>" error described at the top of this
# file. 3.4.0 is abi_version=2.3.0 / compiler_version=2.3.10 -- the newest release
# this Kotlin can consume. Manifests checked individually; revisit on Kotlin 2.4.x.
# Note this does NOT silence the "Skiko dependencies' versions are incompatible"
# warning: coil3 3.4.0 declares skiko 0.9.22.2 while Compose Multiplatform 1.11.1
# pulls 0.144.6, so Gradle upgrades it. Only coil3 3.5.0 declares 0.144.6, and that
# needs Kotlin 2.4.0. Skiko is a CMP implementation detail and nothing here
# references it directly, so the resolved-upward version is safe.
coil3 = "3.4.0"
lifecycleKmp = "2.9.0"

# Phase 4 (RevenueCat integration): KMP artifact declared as a plain commonMain
# `implementation()` (same as coil3/ktor-darwin above), no CocoaPods needed --
# confirmed via RevenueCat's own cat-paywall-kmp sample. Correction to the earlier
# note here: the iOS side is NOT pure Kotlin, it is a cinterop klib that BUNDLES
# RevenueCat's compiled Swift objects. That is still CocoaPods-free (nothing has to
# resolve a PurchasesHybridCommon framework), but it does mean the Kotlin/Native
# test executable needs the platform Swift back-deployment shims on its linker
# search path -- see the `swiftRuntimeSearchPath` workaround in shared/build.gradle.kts
# for why the path RevenueCat bakes into the klib cannot be used.
# All 3.x releases (3.0.0..3.5.0, manifests checked individually) are built by the
# Kotlin 2.3.20 compiler, which is what forced the Kotlin bump above.
purchasesKmp = "3.5.0"

# AndroidX Core
coreKtx = "1.19.0"
lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.9.3"

# Compose
composeBom = "2026.08.00"
navigationCompose = "2.10.0"

# Room bumped 2.6.1 -> 2.8.4: KSP2 (bundled with Kotlin 2.2.20's ksp plugin,
# see kotlin/ksp above) has a known bug processing Room DAO suspend functions
# returning Unit ("unexpected jvm signature V", google/ksp#2177/#2957),
# fixed by upgrading Room to 2.7.0+.
room = "2.8.4"

# Ktor (for KMM-compatible networking)
ktor = "3.0.2"

# Coroutines
coroutines = "1.9.0"

# DataStore
datastore = "1.1.1"

# Image Loading
coil = "2.5.0"

