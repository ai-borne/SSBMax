		7A1C9B3E5D2F4A6B8C9D0E1F /* Embed Compose Resources (Kotlin/Native) */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			buildActionMask = 2147483647;
			files = (
			);
			inputPaths = (
			);
			name = "Embed Compose Resources (Kotlin/Native)";
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# This project links SharedKit.framework manually via FRAMEWORK_SEARCH_PATHS/\n# OTHER_LDFLAGS (a static framework) rather than through the standard\n# JetBrains Xcode-integration template, which normally runs this task from a\n# Run Script phase. Skipping it meant Compose Multiplatform's compose-resources\n# bundle (strings, drawables, etc.) never made it into the app bundle --\n# discovered via a real launch crash (MissingResourceException on\n# strings.commonMain.cvr) once a screen using stringResource() actually rendered.\n#\n# Move 2 (iOS CocoaPods->SPM convergence): the framework is now produced by\n# :data-firebase, not :shared. That module sits at the top of the Kotlin\n# dependency graph, so only a framework built there carries BOTH shared's\n# UI/ViewModels and the Firebase-backed repository implementations the Koin\n# graph needs.\n#\n# Two guards that used to live here are gone with CocoaPods itself:\n#  - an `if [ \\\"$ACTION\\\" = \\\"indexbuild\\\" ]` early-exit, because Xcode's\n#    background Index Build raced the real build on the Kotlin CocoaPods\n#    plugin's shared synthetic Xcode project (\\\"database is locked\\\").\n#    No synthetic project exists any more.\n#  - a PATH export for /opt/homebrew/bin so the `pod` CLI was reachable from\n#    Xcode's minimal Run Script PATH. Nothing shells out to `pod` now.\n#\n# JAVA_HOME still needs setting explicitly: Xcode Run Script phases do not\n# source ~/.zshrc, and there is no JDK registered with /usr/libexec/java_home,\n# so Gradle fails with \\\"Unable to locate a Java Runtime\\\" without it.\nif [ -z \"$JAVA_HOME\" ]; then\n  export JAVA_HOME=\"/Applications/Android Studio.app/Contents/jbr/Contents/Home\"\nfi\ncd \"$SRCROOT/..\"\n./gradlew :data-firebase:embedAndSignAppleFrameworkForXcode\n";
		};
		4D8A2C6E9F1B4573A0D3E8B6 /* Ensure GoogleService-Info.plist */ = {
			isa = PBXShellScriptBuildPhase;
			buildActionMask = 2147483647;
			files = (
			);
			inputPaths = (
				"$(SRCROOT)/iosApp/GoogleService-Info.plist.example",
			);
			name = "Ensure GoogleService-Info.plist";
			outputPaths = (
				"$(SRCROOT)/iosApp/GoogleService-Info.plist",
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Phase 6 (KMP migration plan, item 1): GoogleService-Info.plist is a\n# real Firebase credential and is gitignored, same treatment as\n# app/google-services.json on the Android side -- it will not exist in a\n# fresh checkout. Auto-provision the checked-in placeholder template so\n# the build still compiles/runs against Compose UI, and loudly (but\n# non-fatally, matching the Android side's own gap) warn if the resolved\n# file is still the placeholder, so live Firebase calls failing at\n# runtime is never a silent surprise.\nPLIST=\"${SRCROOT}/iosApp/GoogleService-Info.plist\"\nEXAMPLE=\"${SRCROOT}/iosApp/GoogleService-Info.plist.example\"\nif [ ! -f \"$PLIST\" ]; then\n  cp \"$EXAMPLE\" \"$PLIST\"\n  echo \"warning: GoogleService-Info.plist was missing -- copied the placeholder template. Live iOS Firebase (Auth/Firestore/Storage) calls will fail until you replace it with a real file from the Firebase console. See iosApp/iosApp/GoogleService-Info.plist.example for exact steps.\"\nfi\nif grep -q \"REPLACE_WITH_REAL\" \"$PLIST\"; then\n  echo \"warning: GoogleService-Info.plist still contains placeholder values -- live iOS Firebase (Auth/Firestore/Storage) calls will fail. See iosApp/iosApp/GoogleService-Info.plist.example for exact Firebase console steps.\"\nfi\n";
		};
