    source: shared/.../domain/model/SSBPhase.kt
    members:
      - OIR
      - PPDT
      - PIQ
      - TAT
      - WAT
      - SRT
      - SD
      - GTO_GD
      - GTO_GPE
      - GTO_PGT
      - GTO_GOR
      - GTO_HGT
      - GTO_LECTURETTE
      - GTO_IO
      - GTO_CT
      - IO

  - name: TestPhase
    source: shared/.../domain/model/SSBPhase.kt
