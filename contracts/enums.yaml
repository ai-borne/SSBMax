# Enums shared across all four consumers. KMP-authoritative — wire casing is
# SCREAMING_SNAKE_CASE everywhere; a platform's idiomatic casing (e.g. web
# camelCase for local variables) is a rendering choice, never a wire choice.
# See contracts/README.md for the compatibility policy before editing.
schemaVersion: "1.1.0"

enums:
