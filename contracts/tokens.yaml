# Design-token color palette. Phase 7 (docs/plans/CrossPlatform_SSOT) — one
# palette, two renderings (Compose Color objects + CSS custom properties /
# tailwind.config.js).
#
# Reconciliation note (Phase 7, full-unification decision): KMP's
# pre-existing `SSBColors` (navy/olive/military-gold, no dark-mode variant)
# and web's `themeColors`/`index.css` (slate/sky, full light+dark) were two
# different visual languages, not spelling variants of the same thing — a
# real product decision, not a mechanical dedup. Web's palette was chosen as
# the single source because it already had a complete light+dark pair; KMP's
# `SSBColors` military palette is retired by this phase (see the KMP
# consumers listed in contracts/README.md's Phase 7 note).
#
# `info` has no prior web token — web's UI never needed a 4th status color
# distinct from `accent`. Rather than invent a new brand color, `info` is
# defined equal to `accent` in both modes; KMP's `SemanticColors.informational`
# already effectively aliased to a primary/accent role before this phase, so
# this preserves intent rather than changing it.
#
# Hex values use 8-digit RRGGBBAA for tokens carrying alpha (the `Subtle`
# tier variants) — emitters convert to each target language's native color
# format (Kotlin 0xAARRGGBB, CSS RRGGBBAA already the CSS Color 4 order).
schemaVersion: "1.0.0"

