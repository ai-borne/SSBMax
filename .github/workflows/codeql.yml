name: CodeQL

# Static application security testing (SAST) for Kotlin/Java.
'on':
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '23 4 * * 1'  # Weekly, Monday 04:23 UTC — catches advisories in unchanged code.

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write   # required to upload results to the code-scanning tab
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup Android build
        uses: ./.github/actions/setup-android
        with:
          gemini-api-key: ${{ secrets.GEMINI_API_KEY || 'test_key' }}
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v3
        with:
          languages: java-kotlin
          # Manual build: Kotlin extraction needs a real compile to trace.
          # build-mode:none yields "no source code seen" on Kotlin projects.
          build-mode: manual

      # Compile so CodeQL can trace the Kotlin/Java sources. --no-build-cache
      # forces the compiler to actually run (a cache hit produces no trace and
      # CodeQL would see no code).
      - name: Build for CodeQL tracing
        run: ./gradlew :app:assembleDebug --no-build-cache --stacktrace

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
        with:
          category: "/language:java-kotlin"
