name: SSBMax CI

# Triggers cover every branch without a brittle name list:
#  - pull_request runs on PRs from ANY source branch (feature/*, fix/*, etc.)
#  - push runs only on protected branches, so PR commits aren't built twice.
'on':
  pull_request:
  push:
    branches: [ main, develop, 'feature/*', 'feature/**', 'fix/*', 'fix/**', 'tech-debt/*', 'tech-debt/**', 'chore/*', 'chore/**', 'ci/*', 'ci/**', PsyTests ]
  merge_group:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes — but never cancel
# a run on a protected branch (those builds gate merges / publish caches).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

# Least privilege by default; jobs opt into more where needed.
permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.jvmargs=-Xmx4g"

jobs:
  # ── Supply-chain: verify the Gradle wrapper jar hasn't been tampered with ──
  wrapper-validation:
    name: Gradle Wrapper Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Validate wrapper
        uses: gradle/actions/wrapper-validation@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

  # ── Security (runs in parallel with build jobs) ──────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: API Key & Secret Detection (Files)
        run: |
          echo "🔍 Scanning for Gemini API keys in tracked files..."
          if git ls-files | xargs grep -l "AIza[A-Za-z0-9_-]\{35\}" 2>/dev/null; then
            echo "❌ ERROR: Gemini API key detected in tracked files!"
            exit 1
          fi

      - name: Verify sensitive files are not tracked
        run: |
          echo "🔍 Checking for sensitive files in git..."
          SENSITIVE_FILES=("local.properties" "functions/.env" "functions/.env.local" ".env" ".env.production" "*.env.production" "google-services.json" "service-account.json" "firebase-admin-key.json")
          FOUND_SENSITIVE=0
          for file in "${SENSITIVE_FILES[@]}"; do
            if git ls-files | grep -q "^${file}$"; then
              echo "❌ ERROR: Sensitive file tracked: $file"
              FOUND_SENSITIVE=1
            fi
          done
          [ $FOUND_SENSITIVE -eq 1 ] && exit 1 || echo "✅ No sensitive files tracked"

      - name: Check for hardcoded secrets in code
        run: |
          echo "🔍 Scanning for hardcoded secrets patterns..."
          PATTERNS=('apiKey\s*=\s*["\x27]AIza' 'GEMINI_API_KEY\s*=\s*["\x27]AIza' 'api_key\s*=\s*["\x27]AIza' 'functions\.config\(\)\.gemini\.key')
          FOUND_SECRETS=0
          for pattern in "${PATTERNS[@]}"; do
            if git grep -E "$pattern" -- '*.kt' '*.java' '*.js' '*.ts' '*.json' '*.xml' 2>/dev/null; then
              echo "❌ Found potential hardcoded secret: $pattern"
              FOUND_SECRETS=1
            fi
          done
          [ $FOUND_SECRETS -eq 1 ] && exit 1 || echo "✅ No hardcoded secrets detected"

      - name: Validate .gitignore coverage
        run: |
          echo "🔍 Validating .gitignore..."
          REQUIRED=("local.properties" "*.env" "google-services.json" "service-account.json")
          for pattern in "${REQUIRED[@]}"; do
            if ! grep -q "$pattern" .gitignore; then
              echo "⚠️  WARNING: .gitignore missing pattern: $pattern"
              exit 1
            fi
          done

      - name: Check for API keys in commit messages
        run: |
          echo "🔍 Scanning commit messages for secrets..."
          if git log --all --oneline -50 | grep -i "AIza[A-Za-z0-9_-]\{35\}"; then
            echo "❌ ERROR: API key found in commit messages!"
            exit 1
          fi
          echo "✅ Security checks passed"

  # ── Lint (all modules) ───────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup Android build
        uses: ./.github/actions/setup-android
        with:
          gemini-api-key: ${{ secrets.GEMINI_API_KEY || 'test_key' }}
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Run Lint (all modules)
        run: |
          ./gradlew \
            :app:lintDebug \
            :shared:lintDebug \
            --build-cache \
            --parallel \
            --stacktrace

      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: lint-reports
          path: '**/build/reports/lint-results-*.html'
          retention-days: 7

  # ── Unit Tests (all modules) ─────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # checks:write lets the test reporter publish a PR check with inline
    # annotations on failing tests (no more digging through HTML artifacts).
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup Android build
        uses: ./.github/actions/setup-android
        with:
          gemini-api-key: ${{ secrets.GEMINI_API_KEY || 'test_key' }}
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Run All Unit Tests
        run: |
          ./gradlew \
            :app:testDebugUnitTest \
            :shared:testDebugUnitTest \
            :lint:test \
            :detekt-rules:test \
            --build-cache \
            --parallel \
            --stacktrace

      # Hard coverage gate at the thresholds defined per-module in build.gradle.kts.
      # Reuses the test execution above via the build cache (tasks are up-to-date).
      - name: Verify coverage thresholds
        run: |
          ./gradlew \
            :app:jacocoTestCoverageVerification \
            --build-cache \
            --parallel \
            --stacktrace

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@df6247429542221bc30d46a036ee47af1102c451 # v2
        with:
          name: Unit Test Results
          path: '**/build/test-results/testDebugUnitTest/*.xml'
          reporter: java-junit
          fail-on-error: false

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

  # ── iOS (shared's Kotlin/Native tests + a real Xcode build) ───────────
  # Phase 0b (KMP-convergence plan). Link before xcodebuild on purpose: a
  # link failure is `shared`'s own problem and should fail fast under
  # Gradle's clearer output, not surface later as an opaque Xcode error.
  # assembleSharedKitXCFramework is deliberately NOT run here (release
  # framework assembly is a release-pipeline concern, not a PR gate).
  #
  # This job is the ONLY thing that compiles Kotlin for Apple targets. It is
  # therefore the only gate that can catch a klib ABI mismatch, a Kotlin/Native
  # source rejection (e.g. commas in backticked test names), or a missing
  # linker search path. Keep the device-target compile below alongside the
  # simulator one: an iosArm64-only break is otherwise invisible.
  #
  # Xcode version pinned: the Kotlin/Native compiler's bundled Clang has to be
  # able to parse the target SDK's headers, and Kotlin 2.2.20 was the release
  # that added Xcode 26 support (retained in 2.3.20), so this job uses Xcode
  # 26.2. That is the floor for the Swift package graph too: the resolved
  # firebase-ios-sdk pulls swift-protobuf 1.38.x, whose Package.swift requires
  # Swift tools 6.2.0 -- Xcode 16.x ships Swift 6.0 and fails xcodebuild with
  # "using Swift tools version 6.2.0 but the installed version is 6.0.0". Do
  # NOT drop back to Xcode 16.x without also pinning swift-protobuf to a
  # Swift-6.0-compatible version.
  # (This block used to describe a CocoaPods/Firebase-pods integration. That is
  # long gone -- iOS dependency management is SPM only, see root CLAUDE.md.)
  ios-tests:
    name: iOS (shared tests + Xcode build)
    runs-on: macos-15
    timeout-minutes: 45
    # Overrides the workflow-level GRADLE_OPTS, which pins -Xmx4g. The
    # Kotlin/Native compiler runs inside the Gradle daemon and needs more than
    # that to link Compose Multiplatform + skiko + GitLive + RevenueCat; 4g
    # dies with "e: Compilation failed: Java heap space". Keep this in step with
    # org.gradle.jvmargs in gradle.properties.
    env:
      GRADLE_OPTS: "-Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.jvmargs=-Xmx8g"
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Select Xcode 26.2
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1
        with:
          xcode-version: '26.2'

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY || 'your_api_key_here' }}" >> local.properties

      - name: Setup google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Setup iOS secrets
        run: |
          echo "GEMINI_API_KEY = ${{ secrets.GEMINI_API_KEY || 'your_api_key_here' }}" > iosApp/iosApp/Secrets.xcconfig
          cp iosApp/iosApp/GoogleService-Info.plist.example iosApp/iosApp/GoogleService-Info.plist

      - name: Setup real GoogleService-Info.plist
        env:
          IOS_GOOGLE_SERVICES_PLIST: ${{ secrets.IOS_GOOGLE_SERVICES_PLIST }}
        if: ${{ env.IOS_GOOGLE_SERVICES_PLIST != '' }}
        run: printf '%s' "$IOS_GOOGLE_SERVICES_PLIST" > iosApp/iosApp/GoogleService-Info.plist

      - name: Compile shared for the iOS device target
        # iosSimulatorArm64Test below never touches iosArm64, so a
        # device-only compile break would ship unnoticed.
        run: |
          ./gradlew :shared:compileKotlinIosArm64 \
            --build-cache \
            --stacktrace

      - name: Run shared's Kotlin/Native tests
        # Implies :shared:linkDebugTestIosSimulatorArm64 -- the link step is
        # where missing frameworks and linker search paths surface, and it is
        # the reason this step must never be reduced to a compile-only check.
        run: |
          ./gradlew :shared:iosSimulatorArm64Test \
            --build-cache \
            --stacktrace

      - name: Link shared's debug framework
        run: |
          ./gradlew :data-firebase:linkDebugFrameworkIosSimulatorArm64 \
            --build-cache \
            --stacktrace

      - name: Build iosApp
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' build

      - name: Upload iOS test reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ios-test-reports
          path: shared/build/reports/tests/
          retention-days: 7

  # ── Build APK (only after lint + tests pass) ─────────────────────────
  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup Android build
        uses: ./.github/actions/setup-android
        with:
          gemini-api-key: ${{ secrets.GEMINI_API_KEY || 'test_key' }}
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Assemble Debug APK
        run: ./gradlew :app:assembleDebug --build-cache --parallel --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

  # ── Firestore rules-unit tests ───────────────────────────────────────
  # Guards against a repeat of the stuck-ACTIVE test_sessions incident: a
  # firestore.rules change that looked like a tightening (or a
  # simplification of the update rule's three-way OR) silently broke a real
  # client transition, and nothing in CI exercised the rules file to catch
  # it before merge. See firestore-tests/test_sessions.rules.test.mjs.
  firestore-rules:
    name: Firestore Rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      # firebase-tools' Firestore emulator requires Java 21+; this job had no JDK at all
      # (silent failure since the job's introduction: "firebase-tools no longer supports
      # Java version before 21" before a single rules test ever ran).
      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Install rules-test dependencies
        working-directory: firestore-tests
        run: npm ci

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Run rules-unit tests against the emulator
        run: firebase emulators:exec --only firestore --project demo-ssbmax-rules-test "npm --prefix firestore-tests test"

      # ── Phase 6 (docs/plans/CrossPlatform_SSOT): shared-corpus contract tests ──
      # Seeds one fixture corpus (firestore-tests/fixtures/shared-corpus.json) into the
      # emulator, then exercises it from BOTH readers against the same running instance --
      # firestore-tests' Node suite (a proxy for data-firebase's Kotlin DTOs; androidUnitTest
      # itself can't reach a live emulator, see sharedCorpus.contract.test.mjs's docstring)
      # and web's real ContentRepository via the actual firebase/firestore SDK. Needs the
      # Auth emulator too (web signs in anonymously to satisfy firestore.rules'
      # isAuthenticated() checks) and must run against the default project
      # (.firebaserc's "ssbmax-49e68") to match web/.env's VITE_FIREBASE_PROJECT_ID --
      # the rules-unit job above intentionally uses a different demo project, so this is a
      # separate emulators:exec invocation, not appended to it.
      - name: Run shared-corpus contract tests against the emulator
        run: |
          firebase emulators:exec --only firestore,auth \
            "npm --prefix firestore-tests run seed:corpus && npm --prefix firestore-tests run test:corpus && npm --prefix web run test:corpus"

  # ── Detekt (Kotlin static analysis) ──────────────────────────────────
  # Fails only on NEW smells; existing ones are grandfathered per-module via
  # detekt-baseline.xml (a ratchet target to drive down over time).
  detekt:
    name: Detekt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup Android build
        uses: ./.github/actions/setup-android
        with:
          gemini-api-key: ${{ secrets.GEMINI_API_KEY || 'test_key' }}
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Run Detekt
        run: ./gradlew detekt --build-cache --parallel --stacktrace

      - name: Upload Detekt Reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: detekt-reports
          path: '**/build/reports/detekt/detekt.html'
          retention-days: 7

  # ── Contracts (Tier-1 SSOT generator — docs/plans/CrossPlatform_SSOT Phase 1) ──
  # Fails if generated/* or any of its shared/web/functions mirrors
  # are stale relative to contracts/*.yaml, or if the generator's own tests
  # (parser golden-file / malformed-input / regen-diff) regress.
  contracts:
    name: Contracts Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Run generator tests
        run: npm run contracts:test

      - name: Verify generated output matches contracts/*.yaml (no drift)
        run: npm run contracts:check

  # ── Cloud Functions unit tests ────────────────────────────────────────
  # Phase 8 (docs/plans/CrossPlatform_SSOT): functions/ is a Tier-1/Tier-2
  # contract consumer (§1 of the plan) but had no dedicated CI job of its own
  # -- `npm test` only ran locally. Runs standalone (no emulator needed;
  # functions/test/*.test.js mock Firestore/Admin SDK directly).
  functions:
    name: Cloud Functions Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: functions
        run: npm ci

      - name: Run Cloud Functions unit tests
        working-directory: functions
        run: npm test

  # ── 10-point security audit (scripts/validate-security.sh) ───────────
  # Phase 8: this script existed and was documented (root CLAUDE.md's
  # "Security Principles") but was never actually invoked in CI -- only the
  # narrower security-scan job above ran automatically. fetch-depth: 0
  # matches security-scan's own checkout (the script's git-tracked-file scans
  # need full history, not a shallow clone).
  validate-security-script:
    name: Security & Compliance Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run 10-point security & compliance audit
        run: ./scripts/validate-security.sh

  # ── Web Platform CI (ssbmax-web) ────────────────────────────────────
  web-ci:
    name: Web Platform CI (ssbmax-web)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run Codebase Audit
        run: node scripts/audit-web-codebase.js

      - name: Run Web Unit Tests
        working-directory: web
        run: npm test

      - name: Build Web Production Artifacts
        working-directory: web
        run: npm run build

  # ── Single required check for branch protection ──────────────────────
  # Make THIS the required status check in branch-protection rules; it stays
  # stable even as the jobs above are added or renamed.
  #
  # ios-tests deliberately isn't in `needs` yet: it's the newest pipeline
  # (Phase 0b, KMP-convergence plan) and has only recently started running
  # green in real CI after the Xcode 26.2 pin (see the ios-tests job above).
  # Once it's confirmed green across a few PRs, add `ios-tests` to `needs`
  # below -- don't block merges on a gate that's still being validated.
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    if: always()
    # ios-tests belongs here. It was omitted, so the aggregate gate reported
    # success while the iOS job was red -- the second half of why a broken iOS
    # target survived five commits (the first half being the machine-specific
    # org.gradle.java.home in gradle.properties, which failed every job).
    needs: [wrapper-validation, security-scan, lint, detekt, unit-tests, ios-tests, build, firestore-rules, contracts, functions, validate-security-script, web-ci]
    steps:
      - name: Verify all jobs succeeded
        run: |
          echo "wrapper-validation:      ${{ needs.wrapper-validation.result }}"
          echo "security-scan:           ${{ needs.security-scan.result }}"
          echo "lint:                    ${{ needs.lint.result }}"
          echo "detekt:                  ${{ needs.detekt.result }}"
          echo "unit-tests:              ${{ needs.unit-tests.result }}"
          echo "ios-tests:               ${{ needs.ios-tests.result }}"
          echo "build:                   ${{ needs.build.result }}"
          echo "firestore-rules:         ${{ needs.firestore-rules.result }}"
          echo "contracts:               ${{ needs.contracts.result }}"
          echo "functions:               ${{ needs.functions.result }}"
          echo "validate-security-script: ${{ needs.validate-security-script.result }}"
          echo "web-ci:                  ${{ needs.web-ci.result }}"
          if [ "${{ needs.wrapper-validation.result }}" != "success" ] || \
             [ "${{ needs.security-scan.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.detekt.result }}" != "success" ] || \
             [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.ios-tests.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.firestore-rules.result }}" != "success" ] || \
             [ "${{ needs.contracts.result }}" != "success" ] || \
             [ "${{ needs.functions.result }}" != "success" ] || \
             [ "${{ needs.validate-security-script.result }}" != "success" ] || \
             [ "${{ needs.web-ci.result }}" != "success" ]; then
            echo "❌ One or more CI jobs failed."
            exit 1
          fi
          echo "✅ All CI jobs passed."

