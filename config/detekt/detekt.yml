# Detekt configuration for SSBMax. Builds upon detekt's default rule set
# (buildUponDefaultConfig = true), overriding only what's noisy for this
# Compose + Hilt codebase. Existing issues are grandfathered via per-module
# detekt-baseline.xml; this file governs what counts as an issue going forward.

build:
  maxIssues: 0           # New issues fail the build (existing ones are baselined).
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false

complexity:
  LongMethod:
    threshold: 80        # Compose builder funcs run long; default 60 is too strict here.
  LongParameterList:
    functionThreshold: 8 # Hilt @Inject constructors and Composables take many params.
    constructorThreshold: 10
    ignoreDefaultParameters: true
  TooManyFunctions:
    active: false        # ViewModels/DAOs legitimately expose many functions.

style:
  MagicNumber:
    active: false        # Too noisy for UI dimensions/animation specs.
  ReturnCount:
    max: 4
  MaxLineLength:
    maxLineLength: 140
    excludes: ['**/generated/**', '**/contracts/generated/**', '**/shared/contracts/**']
    # Generated files (contracts/README.md "Generated-file LOC exemption",
    # docs/plans/CrossPlatform_SSOT §4.2) mirror their YAML contract source
    # 1:1 and must not be reformatted/split to satisfy style rules.

naming:
  FunctionNaming:
    # @Composable functions are PascalCase by convention.
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    active: true
  MatchingDeclarationName:
    # Kotlin Multiplatform's own actual-file convention is `Foo.android.kt` /
    # `Foo.ios.kt` for a top-level declaration named `Foo` (see shared/src/
    # androidMain, shared/src/iosMain) -- this rule doesn't know about that
    # suffix and flags every one of them as a false positive.
    active: false

comments:
  active: true

exceptions:
  TooGenericExceptionCaught:
    active: false        # Result<T> wrappers intentionally catch broad Exception.
  SwallowedException:
    active: false
